<div class="space-y-4" [formGroup]="form">
  <!-- Annulus Status -->
  <div class="flex items-center gap-3 pb-3 border-b border-slate-100">
    <span class="text-sm font-medium text-slate-700">Annulus Status:</span>
    <app-status-badge [status]="annulusStatus()" />
  </div>

  <div class="grid grid-cols-2 gap-4">
    <!-- Volumetric TOC -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Volumetric TOC (m)</label>
      <input
        type="number"
        formControlName="toc"
        placeholder="e.g. 1200"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- CBL TOC -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">CBL TOC (m)</label>
      <input
        type="number"
        formControlName="cblToc"
        placeholder="e.g. 1150"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Shoe Depth -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Shoe Depth (m)</label>
      <input
        type="number"
        formControlName="shoeDepth"
        placeholder="e.g. 2950"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Top Operating Window -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">TOW (psi)</label>
      <input
        type="number"
        formControlName="tow"
        placeholder="e.g. 950"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- MAP -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1"
        >MAP (psi) <span class="text-red-500">*</span></label
      >
      <input
        type="number"
        formControlName="masp"
        placeholder="e.g. 250"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
      @if (form.controls.masp.invalid && form.controls.masp.touched) {
      <p class="text-xs text-red-600 mt-1">Required and must be ≥ 0</p>
      }
    </div>

    <!-- MOP -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">MOP (psi)</label>
      <input
        type="number"
        formControlName="mop"
        placeholder="e.g. 200"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
      @if (form.controls.mop.invalid && form.controls.mop.touched) {
      <p class="text-xs text-red-600 mt-1">Must be ≥ 0</p>
      }
    </div>

    <!-- Updated By -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1"
        >Updated By <span class="text-red-500">*</span></label
      >
      <input
        type="text"
        formControlName="updatedBy"
        placeholder="Enter your name"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
      @if (form.controls.updatedBy.invalid && form.controls.updatedBy.touched) {
      <p class="text-xs text-red-600 mt-1">Required</p>
      }
    </div>
  </div>
</div>
